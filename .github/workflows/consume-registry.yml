# The receiving half of the cross-repo pipeline.
#
# cm_mcp_contracts can approve a contract that is perfectly schema-valid and
# still unrunnable here -- `builtin://forecast_weather` with no such handler, an
# unsupported binding type, a template that will not render. Only this repo can
# answer that, so this is where the new registry is proved before it is pinned.
#
# Fired by a repository_dispatch from the contracts repo on publish, on a daily
# schedule as a safety net if the dispatch token is missing or a delivery is
# lost, and manually.
#
# SETUP, both one-time:
#
#   1. Settings -> Actions -> General -> Workflow permissions: tick "Allow GitHub
#      Actions to create and approve pull requests". The `pull-requests: write`
#      permission below is necessary but NOT sufficient -- GitHub gates PR
#      creation by Actions behind that repo setting, which ships off. Without it
#      every step here succeeds and only the last one fails, with
#      "GitHub Actions is not permitted to create or approve pull requests".
#   2. If cm_mcp_contracts is private, add a token that can read its releases as
#      CONTRACTS_READ_TOKEN. For a public contracts repo, GITHUB_TOKEN is enough.
name: consume-registry

on:
  repository_dispatch:
    types: [contracts-updated]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag in cm_mcp_contracts (default: registry-latest)'
        required: false
        default: 'registry-latest'

permissions:
  contents: write
  pull-requests: write

env:
  CONTRACTS_REPO: ${{ github.repository_owner }}/cm_mcp_contracts

jobs:
  verify-and-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Work out which registry to fetch
        id: pick
        run: |
          TAG="${{ github.event.client_payload.tag }}"
          [ -z "$TAG" ] && TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="registry-latest"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Fetching $TAG from $CONTRACTS_REPO"

      - name: Download the published registry
        env:
          GH_TOKEN: ${{ secrets.CONTRACTS_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.pick.outputs.tag }}" \
            --repo "$CONTRACTS_REPO" \
            --pattern 'registry.tar.gz' \
            --output registry.tar.gz --clobber

          # Extracted to a scratch directory, not over the pinned one: the repo's
          # working tree stays untouched until every check below has passed.
          rm -rf candidate && mkdir candidate
          tar -xzf registry.tar.gz -C candidate
          echo "Published registry contains:"
          jq -r '.contracts[] | "  " + .name + " v" + .version' candidate/registry.json

      - name: Verify this engine can execute every contract
        # The gate. A registry with a tool we cannot run never gets pinned. This
        # also verifies every contract against the sha256 its index recorded.
        run: uv run python scripts/check_registry.py candidate/registry.json

      - name: Run the engine's own tests against the candidate
        # Codegen passing is necessary, not sufficient -- this proves the tools
        # actually load and serve over MCP.
        env:
          CM_REGISTRY_FILE: candidate/registry.json
        run: uv run --extra dev pytest -q tests/test_mcp_surface.py

      - name: Is the content actually new?
        id: diff
        # `contentHash` covers the contracts, their versions and their hashes --
        # not `generatedAt` or `sourceCommit`, which change on every publish. So a
        # commit upstream that touched a script and no contract does not arrive
        # here as a PR to review.
        run: |
          NEW=$(jq -r '.contentHash // empty' candidate/registry.json)
          OLD=$(jq -r '.contentHash // empty' registry/registry.json 2>/dev/null || true)

          if [ -n "$NEW" ] && [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Same contracts, same hashes (${NEW:0:12}). Only the build stamp moved."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "content ${OLD:-none} -> ${NEW:-none}"
          fi

      - name: Pin the new registry
        if: steps.diff.outputs.changed == 'true'
        # Replaced wholesale rather than merged, so a contract deleted upstream
        # disappears here too. The legacy single-file artifact goes with it.
        run: |
          rm -rf registry registry.generated.json
          mv candidate registry

      - name: Clear the scratch copy
        # Whether or not anything was pinned; create-pull-request commits the tree.
        if: always()
        run: rm -rf candidate registry.tar.gz

      - name: Open a PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Who opens the PR decides whether its checks run unattended. Events
          # created with the default GITHUB_TOKEN cannot trigger further workflow
          # runs -- GitHub's recursion guard -- so the pin PR's `ci` run parks as
          # action_required and a human has to press "Approve and run" before the
          # check that proves this engine can execute the registry will even start.
          # REGISTRY_PIN_TOKEN is a real identity, so the run starts by itself.
          #
          # Falls back to GITHUB_TOKEN when the secret is absent: the pin PR still
          # opens, exactly as before, and only the approval click comes back.
          token: ${{ secrets.REGISTRY_PIN_TOKEN || secrets.GITHUB_TOKEN }}
          branch: registry/${{ steps.pick.outputs.tag }}
          # A PR rather than a direct push: pinning a new registry changes which
          # tools this service serves in production, which deserves a human
          # glance even though a machine already proved it runs.
          title: 'Registry update: ${{ steps.pick.outputs.tag }}'
          commit-message: 'Pin registry ${{ steps.pick.outputs.tag }}'
          body: |
            Automated pin of the registry published by `${{ env.CONTRACTS_REPO }}`.

            | | |
            |---|---|
            | tag | `${{ steps.pick.outputs.tag }}` |
            | contracts commit | `${{ github.event.client_payload.commit || 'n/a' }}` |
            | tools | ${{ github.event.client_payload.tools || 'see diff' }} |

            Verified before opening:

            - every contract matches the sha256 its index recorded
            - every contract generates code this engine can run
            - every `builtin://` handler it names exists here
            - the MCP surface loads and serves the registry

            One file per contract under `registry/contracts/`, listed in
            `registry/registry.json`. The engine serves what the index lists and
            nothing else, so the diff below is the whole change.

            Merging changes which tools this engine serves.
          labels: registry, automated
