[project]
name = "cm-mcp-engine"
version = "0.1.0"
description = "Code-mode execution engine: turns approved contracts into runnable, sandboxed, cached MCP tools"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.11",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    # The mock partner API that lets the demo run offline.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
cm-engine = "cm_engine.server:main"
cm-mock-api = "cm_engine.mock_partner_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cm_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
log_level = "WARNING"
